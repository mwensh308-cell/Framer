<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Pharaohs' Archive</title>
  <meta name="description" content="The history of Egyptian football: players, clubs, championships and national teams, with live news.">
  <meta name="theme-color" content="#f4ecdc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3 29 28H3Z' fill='%23121110'/></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="wrap masthead__row">
      <a class="brand" href="/" data-link>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 29 28H3Z"/></svg>
        <span>The Pharaohs’ Archive<small lang="ar">أرشيف الفراعنة</small></span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">Menu</button>
      <nav id="primary-nav" class="nav" aria-label="Primary">
        <a href="/players" data-link>Players</a>
        <a href="/clubs" data-link>Clubs</a>
        <a href="/championships" data-link>Championships</a>
        <a href="/national-teams" data-link>National teams</a>
        <a href="/timeline" data-link>Timeline</a>
        <a href="/news" data-link>News <span class="live-dot" aria-hidden="true"></span></a>
        <a class="nav__mobile" href="/search" data-link>Search</a>
      </nav>
      <form class="search" role="search" action="/search" data-search>
        <label class="sr-only" for="q">Search players, clubs and competitions</label>
        <input id="q" name="q" type="search" placeholder="Search the archive" autocomplete="off">
      </form>
    </div>
    <div class="ticker" aria-label="Latest headlines">
      <div class="wrap ticker__row">
        <span class="ticker__label">Live</span>
        <div class="ticker__track" id="ticker" aria-live="polite"></div>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" hidden></div>

  <footer class="footer">
    <div class="wrap footer__row">
      <p>The Pharaohs’ Archive — the story of Egyptian football since 1907.</p>
      <p class="muted">Headlines link to their original publishers. Archive records are edited by our team; <a href="mailto:corrections@example.com">send a correction</a>.</p>
    </div>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
