name: notify-bot

on:
  push:
    paths: ["notify-bot/**", ".github/workflows/notify-bot.yml"]
  pull_request:
    paths: ["notify-bot/**", ".github/workflows/notify-bot.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notify-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notify-bot/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: notify-bridge-apk
          path: notify-bot/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
