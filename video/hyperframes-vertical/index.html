<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"GTA 6"},{"id":"tagline","type":"string","label":"Tagline","default":"Welcome back to the sunshine state"},{"id":"accent","type":"color","label":"Accent","default":"#ff3d8b"},{"id":"accent2","type":"color","label":"Accent 2","default":"#ffb347"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #ff3d8b;
        --accent2: #ffb347;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0618; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="coast" data-composition-id="coast" data-composition-src="compositions/coast.html"
        data-start="0" data-duration="5.2" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="city" data-composition-id="city" data-composition-src="compositions/city.html"
        data-start="5" data-duration="5.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="10" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
