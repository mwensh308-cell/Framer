<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wensh</title>
<script>if(/Chrome\//.test(navigator.userAgent))document.documentElement.classList.add('liquid')</script>
<style>
@font-face{font-family:"Geist";src:url(data:font/woff2;base64,__GEIST__) format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(data:font/woff2;base64,__MONO__) format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{--tint:0;--edge:.55;--chat-blur:3.5px}
:root,[data-theme="dark"]{
  --bg:#06070c;--text:#e8ebf7;--text-soft:rgba(232,235,247,.72);--muted:rgba(232,235,247,.4);
  --tint-a:.1;--tint-b:.03;
  --glass-edge:rgba(255,255,255,calc(.14*var(--edge)));
  --glass-rim:rgba(255,255,255,calc(.32*var(--edge)));
  --glass-rim-low:rgba(255,255,255,calc(.08*var(--edge)));
  --glass-glow:rgba(140,170,255,.07);--glass-sheen:rgba(255,255,255,.1);
  --glass-shadow:0 16px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --chip:rgba(255,255,255,.05);--chip-hover:rgba(255,255,255,.12);--chip-edge:rgba(255,255,255,.1);
  --accent:#7aa2ff;--thumb:rgba(255,255,255,.14);--focus:rgba(122,162,255,.3);
}
[data-theme="light"]{
  --bg:#f4f5f9;--text:#14161f;--text-soft:rgba(20,22,31,.72);--muted:rgba(20,22,31,.45);
  --tint-a:.55;--tint-b:.25;--glass-glow:rgba(120,140,220,.06);--glass-sheen:rgba(255,255,255,.5);
  --glass-shadow:0 16px 48px rgba(20,30,60,.16),0 2px 8px rgba(20,30,60,.08);
  --chip:rgba(0,0,0,.04);--chip-hover:rgba(0,0,0,.08);--chip-edge:rgba(0,0,0,.1);--thumb:rgba(255,255,255,.8);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
.svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* glass */
.glass{position:fixed;isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,calc(var(--tint-a)*var(--tint))),rgba(255,255,255,calc(var(--tint-b)*var(--tint))));
  border:1px solid var(--glass-edge);
  box-shadow:inset 1px 1px 0 var(--glass-rim),inset -1px -1px 0 var(--glass-rim-low),inset 0 0 24px var(--glass-glow),var(--glass-shadow);
  -webkit-backdrop-filter:blur(var(--blur,6px)) saturate(180%);backdrop-filter:blur(var(--blur,6px)) saturate(180%);
  transition:background .4s,border-color .4s,box-shadow .4s}
html.liquid .glass{backdrop-filter:url(#liquid-glass) blur(var(--blur,6px)) saturate(180%)}
.glass::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(180deg,var(--glass-sheen),transparent 48%);pointer-events:none}

.field{display:block;width:100vw;height:100vh;touch-action:none;font-family:"Geist Mono",ui-monospace,Menlo,monospace}

/* top bar */
.topbar{position:fixed;z-index:30;top:18px;left:50%;translate:-50% 0;display:flex;gap:8px}
.choices.glass{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;--blur:5px;max-width:max(240px,calc(100vw - 300px));overflow-x:auto;scrollbar-width:none}
.choices::-webkit-scrollbar{display:none}
.thumb{position:absolute;top:0;left:0;height:32px;width:0;border-radius:999px;background:var(--thumb);
  box-shadow:inset 0 1px 0 var(--glass-rim),0 2px 8px #0000001f;
  transition:translate .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1),height .35s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.thumb.instant{transition:none}
.choice{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border:0;background:none;
  font-size:13px;font-weight:500;color:var(--muted);transition:color .3s;border-radius:999px;white-space:nowrap;outline:none}
.choice:hover{color:var(--text-soft)}
.choice[aria-checked="true"]{color:var(--text)}
.choice:focus-visible{box-shadow:0 0 0 2px var(--focus)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--sw) 50%,white),var(--sw) 70%)}

/* stage */
.stage{position:fixed;top:50%;left:50%;translate:-50% -50%;z-index:20}
.masthead{position:absolute;bottom:100%;left:50%;translate:-50% 0;margin-bottom:28px;display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none}
.avatar{position:relative;width:66px;height:66px;border-radius:50%;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,#ffffff1a,#ffffff05);border:1px solid var(--glass-edge);
  box-shadow:inset 1px 1px 0 var(--glass-rim),var(--glass-shadow);
  -webkit-backdrop-filter:blur(var(--chat-blur)) saturate(180%);backdrop-filter:blur(var(--chat-blur)) saturate(180%)}
html.liquid .avatar{backdrop-filter:url(#liquid-glass) blur(var(--chat-blur)) saturate(180%)}
.avatar::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.62;
  background:repeating-linear-gradient(176deg,rgba(255,255,255,.16) 0 2px,rgba(0,0,0,.16) 2px 5px),radial-gradient(circle at 38% 32%,#9a9ea8,#4a4d55 62%,#24262c)}
.greeting{margin:0;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Geist,system-ui,sans-serif;
  font-size:clamp(24px,5vw,32px);font-weight:500;line-height:1.15;letter-spacing:-.02em;color:#e8e8e8;
  text-shadow:0 0 6px var(--bg),0 0 24px var(--bg)}

.composer.glass{position:relative;width:min(720px,calc(100vw - 32px));display:flex;flex-direction:column;gap:18px;padding:18px 12px 12px 18px;border-radius:24px;
  --blur:calc(var(--chat-blur) * 2);--glass-rim:rgba(255,255,255,calc(.14*var(--edge)));--glass-sheen:rgba(255,255,255,.04);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Geist,system-ui,sans-serif}
.composer.glass:focus-within{border-color:rgba(122,162,255,calc(.3*var(--edge)));
  box-shadow:inset 1px 1px 0 var(--glass-rim),inset -1px -1px 0 var(--glass-rim-low),inset 0 0 24px var(--glass-glow),var(--glass-shadow),0 0 0 3px rgba(122,162,255,calc(.12*var(--edge)))}
.row1{display:flex;gap:12px;align-items:flex-start}
.row1 svg{flex:none;width:18px;height:18px;margin-top:4px;color:#8d8d8d}
.composer textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:none;padding:0;margin:0;font:inherit;font-size:17px;line-height:1.55;color:#ececec;max-height:200px;overflow-y:hidden}
.composer textarea::placeholder{color:#8d8d8d}
.row2{display:flex;justify-content:space-between;align-items:center}
.right{display:flex;gap:6px}
.addbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:none;font-size:14px;color:#c4c4c4;transition:background .2s}
.addbtn:hover{background:#ffffff0d}
.addbtn svg{width:16px;height:16px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;background:none;color:#8d8d8d;transition:background .2s,color .2s;padding:0}
.iconbtn svg{width:17px;height:17px}
.iconbtn.mic:hover{background:#ffffff0f}
.iconbtn.send{background:#3a3a3a;color:#e6e6e6}
.iconbtn.send:disabled{background:#333;color:#7c7c7c;cursor:default}
.iconbtn.send:not(:disabled):hover{background:#f2f2f2;color:#1c1c1c}

.hint{position:fixed;left:14px;bottom:12px;margin:0;font:600 11px "Geist Mono",ui-monospace,Menlo,monospace;letter-spacing:.02em;color:var(--muted);user-select:none;-webkit-user-select:none;pointer-events:none;z-index:5}

/* tweaks */
.tw-open.glass{top:16px;right:16px;z-index:10;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-soft);--blur:10px;background-color:#0a0c148c}
.tw-open:hover{color:var(--text)}
.tw-open svg{width:15px;height:15px}
.tw-open.glass[hidden],.tweaks.glass[hidden]{display:none}
html.liquid .tw-open.glass,html.liquid .tweaks.glass{backdrop-filter:blur(var(--blur)) saturate(180%)}
.tweaks.glass{top:16px;right:16px;z-index:40;width:288px;max-height:calc(100vh - 32px);border-radius:20px;font-size:12px;display:flex;flex-direction:column;--blur:18px;--tint-a:.1;--tint-b:.06;--tint:1;background-color:#0a0c148c;color:var(--text)}
.tw-head{display:flex;align-items:center;gap:6px;padding:12px 10px 10px 16px;border-bottom:1px solid var(--chip-edge)}
.tw-head h2{margin:0 auto 0 0;font-size:13px;font-weight:500}
.chipbtn{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--chip-edge);background:var(--chip);font-size:12px;color:var(--text-soft);transition:background .2s,color .2s,border-color .2s}
.chipbtn:hover{background:var(--chip-hover);color:var(--text)}
.chipbtn.danger{background:rgba(255,90,90,.18);border-color:rgba(255,110,110,.45);color:#ffb4b4}
.closebtn{width:26px;padding:0;font-size:15px;line-height:1}
.tw-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 14px;flex:1;min-height:0}
.tw-group h3{margin:14px 0 6px;font:600 10px "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tw-row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;row-gap:3px;padding:5px 0}
.tw-row label{color:var(--text-soft);cursor:default;user-select:none;-webkit-user-select:none}
.tw-row output{font:600 11px "Geist Mono",ui-monospace,monospace;color:var(--text)}
.tw-row input[type=range]{grid-column:1 / -1}
.tw-row.disabled{opacity:.4}
.tw-row input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:none;cursor:pointer;--fill:50%}
.tw-row input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--fill),var(--chip-edge) var(--fill))}
.tw-row input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--fill),var(--chip-edge) var(--fill))}
.tw-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.15);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tw-row input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.15);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tw-row input[type=range]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.switch{position:relative;width:30px;height:18px;border-radius:999px;border:0;padding:0;background:var(--chip-edge);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:translate .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{translate:12px 0}
.tw-tip{position:fixed;z-index:45;max-width:240px;padding:9px 11px;border-radius:12px;background:#0e101aeb;color:var(--text-soft);font-size:12px;line-height:1.45;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid var(--chip-edge)}
.tw-tip[hidden]{display:none}

@media (max-width:920px){
  .choices.glass{flex-wrap:wrap;justify-content:center;row-gap:2px;overflow:visible;border-radius:22px}
}
@media (max-width:720px){
  .topbar{left:12px;right:12px;translate:none;top:max(12px,env(safe-area-inset-top));justify-content:center}
  .choices.glass{max-width:100%}
  .tw-open.glass{top:auto;bottom:max(12px,env(safe-area-inset-bottom));right:12px}
  .tweaks.glass{top:auto;left:12px;right:12px;bottom:12px;width:auto;max-height:70vh}
  .hint{bottom:max(22px,calc(env(safe-area-inset-bottom) + 10px))}
  .tw-tip{display:none}
}
@media (max-width:640px){
  .choice{height:30px;padding:0 11px 0 9px;gap:6px;font-size:12.5px}
  .thumb{height:30px}
}
@media (max-width:520px){
  .addbtn span{display:none}
  .addbtn{padding:0 9px}
}
@media (max-width:360px){
  .choice{padding:0 8px 0 7px;gap:5px;font-size:12px}
}
@media (max-width:640px) and (min-height:521px) and (max-height:700px){
  .avatar{width:48px;height:48px}
  .masthead{gap:10px;margin-bottom:18px}
  .stage{top:calc(50% + 30px)}
}
@media (max-height:520px){
  .avatar{display:none}
  .masthead{gap:8px;margin-bottom:14px}
  .greeting{font-size:22px}
  .composer.glass{gap:10px;padding:12px 10px 10px 14px}
  .topbar{top:max(8px,env(safe-area-inset-top))}
  .stage{top:calc(50% + 24px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<svg class="svgdefs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence id="lg-turb" type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap id="lg-disp" in="SourceGraphic" in2="soft" scale="40" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<canvas class="field" aria-hidden="true"></canvas>

<div class="topbar">
  <div class="choices glass" role="radiogroup" aria-label="Animal"><span class="thumb instant"></span></div>
</div>

<main class="stage">
  <div class="masthead">
    <div class="avatar"></div>
    <h1 class="greeting">Good morning, Rosalie</h1>
  </div>
  <form class="composer glass" autocomplete="off">
    <div class="row1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.2" y1="15.2" x2="20.5" y2="20.5"/></svg>
      <textarea rows="1" placeholder="Ask anything..." aria-label="Ask anything"></textarea>
    </div>
    <div class="row2">
      <button type="button" class="addbtn" aria-label="Add tabs or files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add tabs or files</span></button>
      <div class="right">
        <button type="button" class="iconbtn mic" aria-label="Voice input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="submit" class="iconbtn send" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
    </div>
  </form>
</main>

<p class="hint">click to scatter</p>

<script>
(() => {
'use strict';
/* ───────────────────────── utilities ───────────────────────── */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const frac = x => x - Math.floor(x);
const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); };
function hash3(a, b, c) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const turnTo = (h, t, m) => h + clamp(angDiff(h, t), -m, m);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const BG = [6, 7, 12];

/* ───────────────────────── tuning ───────────────────────── */
const SHARED = { density: 1, corner: false, direction: 49, speed: 1, sway: .04, spread: .06, size: 1, farthest: .45, farBias: 1.6, grip: 2, separation: 300,
  hue: 0, shimmer: .3, sparkle: .12, fog: .75, trail: 1, trailFade: 1.3, grid: 1.05, detail: 1.3 };
const GLASS_DEF = { blur: 3.5, refraction: 40, ripple: .007, tint: 0, edge: .55, radius: 24, width: 720 };
let T = { ...SHARED };
let G = { ...GLASS_DEF };

/* ───────────────────────── renderer state ───────────────────────── */
const canvas = document.querySelector('.field');
const ctx = canvas.getContext('2d');
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
let W = 0, H = 0, dpr = 1, cw = 9, ch = 13, cols = 0, rows = 0, N = 0;
let kind, fr, fg, fb, gr, gg, gb, glyph, field, field2, cellHash;
let fontFamily = '"Geist Mono", ui-monospace, Menlo, monospace';
let time = 0, tick6 = 0, tick24 = 0, tick2 = 0;
let hueM = null;

const PLAIN = 1, SHINE = 2, DARK = 3, LIGHT = 4, FUR = 5, SOFT = 6, BRIGHT = 7, LINE = 8;
const RAMP = '.:;+=*%#';
const DEF_GL = [null, RAMP, RAMP, '#%@', 'o*', '8#@', RAMP, '.:*', '.:+*'];
const EDGE_HI = ':;', EDGE_LO = ".',`";
const PXF = [.5, .25, .75, .25, .75], PYF = [.5, .30, .30, .72, .72];

function setHue(deg) {
  if (!deg) { hueM = null; return; }
  const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  hueM = [
    .213 + c * .787 - s * .213, .715 - c * .715 - s * .715, .072 - c * .072 + s * .928,
    .213 - c * .213 + s * .143, .715 + c * .285 + s * .140, .072 - c * .072 - s * .283,
    .213 - c * .213 - s * .787, .715 - c * .715 + s * .715, .072 + c * .928 + s * .072];
}
let HR = 0, HG = 0, HB = 0;
function hue(r, g, b) {
  if (!hueM) { HR = r; HG = g; HB = b; return; }
  const m = hueM;
  HR = m[0] * r + m[1] * g + m[2] * b; HG = m[3] * r + m[4] * g + m[5] * b; HB = m[6] * r + m[7] * g + m[8] * b;
}

function paintBg() {
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  bgCtx.setTransform(1, 0, 0, 1, 0, 0);
  bgCtx.fillStyle = 'rgb(6,7,12)';
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  const a = .055 * T.grid;
  if (a > 0) {
    bgCtx.fillStyle = `rgba(255,255,255,${Math.min(1, a)})`;
    const lw = Math.max(1, Math.round(dpr));
    for (let c = 0; c <= cols; c++) bgCtx.fillRect(Math.round(c * cw * dpr), 0, lw, bgCanvas.height);
    for (let r = 0; r <= rows; r++) bgCtx.fillRect(0, Math.round(r * ch * dpr), bgCanvas.width, lw);
  }
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = Math.max(1, rect.width); H = Math.max(1, rect.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  cw = clamp(Math.round(W / 124 / T.detail), 5, 24); ch = Math.round(cw * 1.45);
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch); N = cols * rows;
  kind = new Uint8Array(N);
  fr = new Uint8ClampedArray(N); fg = new Uint8ClampedArray(N); fb = new Uint8ClampedArray(N);
  gr = new Uint8ClampedArray(N); gg = new Uint8ClampedArray(N); gb = new Uint8ClampedArray(N);
  glyph = new Array(N).fill('');
  field = new Float32Array(N); field2 = new Float32Array(N);
  cellHash = new Float32Array(N);
  for (let i = 0; i < N; i++) cellHash[i] = hash3(i, 91, 17);
  const ff = getComputedStyle(canvas).fontFamily; if (ff) fontFamily = ff;
  paintBg();

const opener = document.createElement('button');
opener.type = 'button'; opener.className = 'tw-open glass';
opener.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Tweaks';
opener.setAttribute('aria-expanded', 'false');
const panel = document.createElement('aside');
panel.className = 'tweaks glass'; panel.hidden = true; panel.setAttribute('aria-label', 'Tweaks');
panel.innerHTML = '<div class="tw-head"><h2>Tweaks</h2><button type="button" class="chipbtn" data-act="copy">Copy</button><button type="button" class="chipbtn" data-act="reset">Reset</button><button type="button" class="chipbtn closebtn" data-act="close" aria-label="Close">×</button></div><div class="tw-body"></div>';
const tip = document.createElement('div'); tip.className = 'tw-tip'; tip.hidden = true;
document.body.append(opener, panel, tip);
const body = panel.querySelector('.tw-body');

function setOpen(on) {
  panel.hidden = !on; opener.hidden = on; opener.setAttribute('aria-expanded', on);
  store.set('wild-tab:tweaks-open', on ? '1' : '0');
  if (!on) tip.hidden = true;
}
opener.addEventListener('click', () => setOpen(true));
let resetArm = 0, copyTimer = 0;
panel.querySelector('.tw-head').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') setOpen(false);
  else if (act === 'copy') {
    const text = JSON.stringify(diffs(), null, 2);
    const done = msg => { b.textContent = msg; clearTimeout(copyTimer); copyTimer = setTimeout(() => b.textContent = 'Copy', 1400); };
    const fallback = () => { console.log(text); done('In console'); };
    try { navigator.clipboard.writeText(text).then(() => done('Copied'), fallback); } catch (err) { fallback(); }
  } else if (act === 'reset') {
    if (resetArm) {
      clearTimeout(resetArm); resetArm = 0; b.textContent = 'Reset'; b.classList.remove('danger');
      store.del(storeKey(SP)); T = defaultsFor(SP); G = { ...GLASS_DEF };
      applyAll(true); buildPanel();
    } else {
      b.textContent = 'Reset all?'; b.classList.add('danger');
      resetArm = setTimeout(() => { resetArm = 0; b.textContent = 'Reset'; b.classList.remove('danger'); }, 3000);
    }
  }
});

const decimals = step => step >= 1 ? 0 : (String(step).split('.')[1] || '').length;
function applyAll(full) {
  setHue(T.hue); applyGlass();
  resize(); maintain();
  if (full) { field.fill(0); }
  redrawIfStill();
}
function onChange(key, isGlass) {
  if (isGlass) applyGlass();
  else if (key === 'detail') { resize(); maintain(); }
  else if (key === 'hue') { setHue(T.hue); paintBg(); }
  else if (key === 'grid') paintBg();
  if (key === 'corner') syncDisabled();
  saveTweaks();
  redrawIfStill();
}
let rowRefs = [];
function syncDisabled() {
  for (const r of rowRefs) if (r.key === 'direction') { r.row.classList.toggle('disabled', !!T.corner); r.input.disabled = !!T.corner; }
}
function makeRow(def, obj, isGlass) {
  const [key, label] = def;
  const row = document.createElement('div'); row.className = 'tw-row';
  const lab = document.createElement('label'); lab.textContent = label;
  row.appendChild(lab);
  const hint = def[2] === 'toggle' ? def[3] : def[5];
  let input, refresh;
  if (def[2] === 'toggle') {
    input = document.createElement('button'); input.type = 'button'; input.className = 'switch'; input.setAttribute('role', 'switch'); input.setAttribute('aria-label', label);
    refresh = () => input.setAttribute('aria-checked', !!obj()[key]);
    input.addEventListener('click', () => { obj()[key] = !obj()[key]; refresh(); onChange(key, isGlass); });
    row.appendChild(input);
  } else {
    const [, , min, max, step, , unit = ''] = def;
    const out = document.createElement('output');
    input = document.createElement('input'); input.type = 'range'; input.min = min; input.max = max; input.step = step; input.setAttribute('aria-label', label);
    const dec = decimals(step);
    refresh = () => {
      const v = obj()[key]; input.value = v; out.textContent = (+v).toFixed(dec) + unit;
      input.style.setProperty('--fill', ((v - min) / (max - min) * 100).toFixed(2) + '%');
    };
    input.addEventListener('input', () => { obj()[key] = +(+input.value).toFixed(dec + 1); refresh(); onChange(key, isGlass); });
    row.append(out, input);
  }
  lab.addEventListener('dblclick', () => {
    obj()[key] = isGlass ? GLASS_DEF[key] : defaultsFor(SP)[key]; refresh(); onChange(key, isGlass);
  });
  const show = () => {
    if (innerWidth <= 720) return;
    tip.textContent = hint + ' Double-click the name to reset it.'; tip.hidden = false;
    const pr = panel.getBoundingClientRect(), rr = row.getBoundingClientRect();
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(8, pr.left - tw - 10) + 'px';
    tip.style.top = clamp(rr.top, 8, innerHeight - tip.offsetHeight - 8) + 'px';
  };
  row.addEventListener('mouseenter', show); row.addEventListener('mouseleave', () => tip.hidden = true);
  row.addEventListener('focusin', show); row.addEventListener('focusout', () => tip.hidden = true);
  refresh();
  rowRefs.push({ key, row, input, refresh });
  return row;
}
function group(title, defs, isGlass) {
  const g = document.createElement('section'); g.className = 'tw-group';
  const h = document.createElement('h3'); h.textContent = title; g.appendChild(h);
  const hide = isGlass ? [] : (SP.hide || []);
  for (const d of defs) if (!hide.includes(d[0])) g.appendChild(makeRow(d, isGlass ? () => G : () => T, isGlass));
  body.appendChild(g);
}
function buildPanel() {
  const st = body.scrollTop;
  body.innerHTML = ''; rowRefs = [];
  group('Movement', MOVEMENT);
  for (const [t, defs] of SP.groups) group(t, defs);
  group('Look', LOOK);
  group('Chat glass', GLASS, true);
  syncDisabled();
  body.scrollTop = st;
}

addEventListener('storage', e => { if (e.key === storeKey(SP)) location.reload(); });

/* ───────────────────────── species switching ───────────────────────── */
function setSpecies(key, initial) {
  const sp = BY_KEY[key] || Moth;
  if (sp === SP && !initial) return;
  SP = sp; loadTweaks(sp);
  if (!initial) store.set('wild-tab:animal', sp.key);
  setHue(T.hue); applyGlass();
  resize();
  field.fill(0);
  rebuildFlock();
  buildPanel(); markChoice();
  if (reduced) { stillSimulated = false; still(); }
}

/* ───────────────────────── greeting & composer ───────────────────────── */
const greet = document.querySelector('.greeting');
function updateGreeting() {
  const h = new Date().getHours();
  greet.textContent = h >= 5 && h <= 11 ? 'Good morning, Rosalie' : h >= 12 && h <= 16 ? 'Good afternoon, Rosalie' : h >= 17 && h <= 21 ? 'Good evening, Rosalie' : 'Still up, Rosalie?';
}
updateGreeting(); setInterval(updateGreeting, 60000);

const ta = composer.querySelector('textarea'), send = composer.querySelector('.send');
function grow() {
  ta.style.height = 'auto';
  const h = Math.min(ta.scrollHeight, 200);
  ta.style.height = h + 'px'; ta.style.overflowY = ta.scrollHeight > 200 ? 'auto' : 'hidden';
  send.disabled = !ta.value.trim();
}
ta.addEventListener('input', grow);
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (ta.value.trim()) composer.requestSubmit(); }
});
composer.addEventListener('submit', e => {
  e.preventDefault();
  const text = ta.value.trim(); if (!text) return;
  window.dispatchEvent(new CustomEvent('chat:submit', { detail: { text } }));
  ta.value = ''; grow();
});
if (matchMedia('(pointer: fine)').matches) ta.focus({ preventScroll: true });

/* ───────────────────────── boot ───────────────────────── */
if (params.has('debug')) window.__glyph = { get flock() { return flock; }, get T() { return T; }, drawFrame, step, set time(v) { time = v; } };
const urlAnimal = params.get('animal');
const startKey = BY_KEY[urlAnimal] ? urlAnimal : (BY_KEY[store.get('wild-tab:animal')] ? store.get('wild-tab:animal') : 'moths');
setSpecies(startKey, true);
setOpen(store.get('wild-tab:tweaks-open') === '1');
requestAnimationFrame(() => { thumb.classList.remove('instant'); });
if (document.fonts) document.fonts.ready.then(() => { thumb.classList.add('instant'); placeThumb(); requestAnimationFrame(() => thumb.classList.remove('instant')); resize(); if (reduced) drawFrame(); });
if (reduced) still(); else start();
})();
</script>
</body>
</html>
